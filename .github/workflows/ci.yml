name: dalel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      LOCQA_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]" build "setuptools==80.9.0"
      - name: Check contracts
        run: python -m pytest -q
      - name: Build installable package
        run: python -m build --no-isolation
      - name: Check publication paths
        run: python tools/check_tracked_privacy.py
