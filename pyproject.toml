[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "dalel"
version = "1.2.0"
description = "dalel: lossless ARB analysis, verified language corrections and offline review"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["typer>=0.12,<1", "pydantic>=2,<3", "jinja2>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
locqa = "dalel.cli:app"
dalel = "dalel.cli:app"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
dalel = ["assets/*.dart", "assets/*.json", "assets/*.yml", "assets/views/*.html", "assets/workspace/*.html", "assets/workspace/*.css", "assets/workspace/src/app.js", "assets/workspace/src/backend.js", "assets/workspace/src/core.js", "assets/kazakh/*", "assets/uzbek/*", "assets/latin/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dalel*", "locqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/inference"]
