<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>dalel · Проверка исправлений</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f8;color:#182b3c;font:16px Segoe UI,Arial,sans-serif}
header{background:#122d40;color:white;padding:22px max(20px,calc((100vw - 1100px)/2))}h1{font-size:25px;margin:8px 0}header p{color:#c7dbe5;margin:8px 0;line-height:1.5}.wrap{max-width:1100px;margin:22px auto;padding:0 20px}
.setup,.card,.controls{background:white;border:1px solid #ccdce5;border-radius:12px;padding:20px;margin-bottom:16px}label{display:block;margin:8px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #a9c0cc;border-radius:6px}input[type=text]{width:min(100%,400px)}button{background:#f5fafc;cursor:pointer}button.primary{background:#147c68;color:white;border-color:#147c68}button.reject{color:#9d2741}button:disabled{opacity:.4;cursor:not-allowed;background:#f5fafc;color:#526573;border-color:#a9c0cc}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;bottom:0;box-shadow:0 -5px 20px #142c4210}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}h2{font-size:13px;color:#536c7d;text-transform:uppercase;letter-spacing:.05em}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.key{font:14px Consolas,monospace;overflow-wrap:anywhere;color:#4a6579}textarea{width:100%;min-height:120px;line-height:1.6;background:#fcfefc}del{background:#ffe1e6;color:#9f2841}ins{background:#d7f2e6;color:#12644e;text-decoration:none}.evidence{padding:12px;background:#f3f7fa;border-radius:7px;margin-top:10px}.status{font-size:14px;color:#4b687b;margin:12px 0}.warning{background:#fff0c8;color:#674c15;padding:10px;border-radius:6px}button:focus,input:focus,textarea:focus{outline:3px solid #73cfba}#empty{padding:30px}#editing[hidden]{display:none}@media(max-width:650px){.columns{grid-template-columns:1fr}.controls{position:static}.wrap{padding:0 12px}}
</style><header><b>dalel / QA</b><h1>Проверка исправлений</h1><p>A — принять показанный текст и находки · R — отклонить исправление · E — редактировать · ←/→ — перейти</p></header>
<main class="wrap"><div id="mode" class="warning"></div><section class="setup"><label>Имя проверяющего <input id="reviewer" type="text" autocomplete="name" placeholder="Имя и фамилия"></label>
<label><input id="attest" type="checkbox"> Я самостоятельно проверяю показанный перевод и подтверждаю только прочитанные исправления.</label>
<button id="export">Скачать решения JSON</button><div id="progress" class="status" aria-live="polite"></div><div id="exclusions" class="status"></div></section>
<section id="card" class="card"><div id="key" class="key"></div><div class="columns"><div><h2>Исходный текст</h2><div id="source" class="text"></div></div><div><h2>Текущий перевод</h2><div id="target" class="text"></div></div></div>
<h2>Предлагаемое исправление</h2><div id="proposal" class="text"></div><div id="editing" hidden><textarea id="editor" aria-label="Текст исправления"></textarea><button id="save">Сохранить черновик</button><button id="cancel">Отменить редактирование</button></div>
<h2>Изменения</h2><div id="diff" class="text"></div><div id="evidence"></div><div id="context"></div><div id="decision" class="status"></div></section>
<div id="empty" hidden>Нет исправлений для проверки.</div><nav class="controls"><button id="prev">← Назад</button><button id="accept" class="primary">A · Принять</button><button id="reject" class="reject">R · Отклонить</button><button id="edit">E · Изменить</button><button id="next">Далее →</button><span id="position"></span></nav></main>
<script id="payload" type="application/json">__PAYLOAD__</script><script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('payload').textContent),cards=data.cards,$=id=>document.getElementById(id),simulation=data.mode==='simulation',types=__TYPE_NAMES__,levels=__SEVERITY_NAMES__;
let index=0,decisions={},drafts={},stale={},editing=false;const storage='locqa-review:'+data.review_id;
try{const saved=JSON.parse(localStorage.getItem(storage)||'null');if(saved&&saved.review_id===data.review_id){decisions=saved.decisions||{};drafts=saved.drafts||{};stale=saved.stale||{};$('reviewer').value=saved.reviewer||''}}catch(e){}
$('mode').textContent=simulation?'Учебный прогон: решения не являются проверкой человеком и не могут выставить human-флаги.':'Офлайн-проверка: решения сохраняются в этом браузере. Скачайте JSON и примените его командой locqa apply-review.';
if(data.acceptance_gate){$('exclusions').textContent='Проверено по сохранённым результатам и локальным правилам. Исключено исправлений: '+(data.acceptance_gate.excluded_keys||[]).length+'. Причины: review_exclusions.json.';}
function persist(){try{localStorage.setItem(storage,JSON.stringify({review_id:data.review_id,decisions,drafts,stale,reviewer:$('reviewer').value}))}catch(e){}}
function text(id,value){$(id).textContent=value===null?'[значение отсутствует]':value}
function diff(before,after){const tokenize=value=>(value||'').match(/[\p{L}\p{M}\p{N}_]+|\s+|[^\s]/gu)||[],a=tokenize(before),b=tokenize(after),node=$('diff');node.replaceChildren();const append=(tag,value)=>{if(!value)return;if(!tag)node.append(document.createTextNode(value));else{const el=document.createElement(tag);el.textContent=value;node.append(el)}};if(a.length*b.length>250000){append('del',before);append('ins',after);return}const lengths=Array.from({length:a.length+1},()=>new Uint32Array(b.length+1));for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)lengths[i][j]=a[i]===b[j]?1+lengths[i+1][j+1]:Math.max(lengths[i+1][j],lengths[i][j+1]);let i=0,j=0;while(i<a.length||j<b.length){if(i<a.length&&j<b.length&&a[i]===b[j]){append(null,a[i++]);j++}else if(i<a.length&&(j===b.length||lengths[i+1][j]>=lengths[i][j+1]))append('del',a[i++]);else append('ins',b[j++])}}
function siblings(title,rows){const detail=document.createElement('details'),heading=document.createElement('summary');heading.textContent=title+' · '+rows.length+' употреблений';detail.append(heading);for(const row of rows){const el=document.createElement('div');el.className='evidence';el.textContent=row.key+' · '+row.source+' → '+(row.proposed??'[нет перевода]');detail.append(el)}$('context').append(detail)}
function canonChoices(card){const result={};for(const key of card.canon_dependencies||[]){const decision=decisions[key];if(!decision||decision.action!=='accept')return null;result[key]={text:decision.text,at:decision.at}}return result}
function current(){return cards[index]}function proposed(card){return Object.hasOwn(drafts,card.key)?drafts[card.key]:card.suggestion}
function show(){editing=false;$('editing').hidden=true;$('proposal').hidden=false;$('card').hidden=!cards.length;$('empty').hidden=!!cards.length;
for(const id of ['accept','reject','edit','prev','next','export'])$(id).disabled=!cards.length;
$('progress').textContent=Object.keys(decisions).length+' решений из '+cards.length+' · '+(simulation?'учебный прогон':'решения ещё нужно применить к ARB');if(!cards.length){if(data.acceptance_gate&&!data.acceptance_gate.passed)text('empty','Проверка исправленного файла ещё не пройдена. Очередь приёмки закрыта до устранения дефектов.');return;}
const card=current(),value=proposed(card);text('key',card.label||card.key);text('source',card.source);text('target',card.target);text('proposal',value);diff(card.target,value);$('evidence').replaceChildren();
for(const finding of card.findings){const el=document.createElement('div');el.className='evidence';el.textContent=(levels[finding.severity]||finding.severity)+' · '+(types[finding.issue_type]||finding.issue_type)+' — '+finding.evidence;$('evidence').append(el)}
for(const term of (card.term_context?[]:card.glossary||[])){const el=document.createElement('div');el.className='evidence';el.textContent='Глоссарий: '+term.source+' → '+term.target;$('evidence').append(el)}
$('context').replaceChildren();if(card.kind==='canon')siblings('Область применения термина',card.siblings||[]);for(const term of card.term_context||[]){const choice=decisions[term.canon_key],value=choice&&choice.action==='accept'?choice.text:term.target;siblings('Канон: '+term.source+' → '+value,term.siblings)}if(card.kind!=='canon'&&(card.canon_dependencies||[]).length&&!canonChoices(card)){const note=document.createElement('p');note.className='warning';note.textContent='Сначала утвердите связанные термины в начале очереди. После изменения канона зависимые переводы нужно проверить заново.';$('context').prepend(note)}
const prior=decisions[card.key];text('decision',stale[card.key]?'Канон изменён: требуется повторная проверка этого перевода.':prior?(prior.action==='accept'?'Принято: '+JSON.stringify(prior.text)+(prior.text!==value?' · новый черновик не принят':''):'Исправление отклонено'):'Решение не принято');text('position',(index+1)+' / '+cards.length);persist()}
function identity(){const name=$('reviewer').value.trim();if(!name){$('reviewer').focus();alert('Укажите имя проверяющего.');return null}if(!simulation&&!$('attest').checked){alert('Подтвердите самостоятельную проверку.');return null}return name}
function decide(action){if(!cards.length||editing)return;const reviewer=identity();if(!reviewer)return;const card=current(),choices=canonChoices(card);if(action==='accept'&&card.kind!=='canon'&&!choices){alert('Сначала утвердите связанные термины в начале очереди.');return}if(card.kind==='canon'){const prior=decisions[card.key],next=action==='accept'?proposed(card):null;if(prior&&(prior.text!==next||prior.action!==action)||!prior&&next!==card.suggestion){for(const dependent of cards)if((dependent.canon_dependencies||[]).includes(card.key)){delete decisions[dependent.key];stale[dependent.key]=true}}}delete stale[card.key];decisions[card.key]={key:card.key,card_hash:card.card_hash,action,text:action==='accept'?proposed(card):null,reviewer,at:new Date().toISOString(),canon_choices:choices||{}};index=Math.min(cards.length-1,index+1);show()}
function move(step){if(editing)return;index=Math.max(0,Math.min(cards.length-1,index+step));show()}
function edit(){if(!cards.length)return;editing=true;$('proposal').hidden=true;$('editing').hidden=false;$('editor').value=proposed(current());$('editor').focus()}
$('accept').onclick=()=>decide('accept');$('reject').onclick=()=>decide('reject');$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('edit').onclick=edit;
$('save').onclick=()=>{drafts[current().key]=$('editor').value;show()};$('cancel').onclick=show;$('reviewer').onchange=persist;
document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea')){if(event.key==='Escape'&&editing){event.preventDefault();show()}return}const key=event.key.toLowerCase();if(['a','r','e','arrowleft','arrowright'].includes(key))event.preventDefault();if(key==='a')decide('accept');if(key==='r')decide('reject');if(key==='e')edit();if(key==='arrowleft')move(-1);if(key==='arrowright')move(1)});
$('export').onclick=()=>{const reviewer=identity();if(!reviewer)return;const entries=Object.values(decisions);if(entries.some(d=>d.reviewer!==reviewer)){alert('Имя изменилось после решений. Верните имя или заново проверьте карточки.');return}const payload={format:1,review_id:data.review_id,mode:data.mode,attest_human:!simulation,reviewer,created_at:new Date().toISOString(),entries};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=simulation?'simulation-decisions.json':'decisions.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};show();
})();</script></html>
