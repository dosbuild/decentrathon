name: Localization QA
on:
  pull_request:
    paths:
      - '**/*.arb'
      - 'l10n.yaml'
      - '.github/actions/locqa/**'
      - '.github/workflows/locqa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .locqa/base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Copy the shipped .github/actions/locqa directory (including its wheel)
      # onto the base branch. The base SHA and wheel checksum pin the tool.
      # PR changes to the tool cannot alter this PR's checks. No LLM secrets.
      - uses: ./.locqa/base/.github/actions/locqa
        with:
          head-root: ${{ github.workspace }}
          base-root: ${{ github.workspace }}/.locqa/base
